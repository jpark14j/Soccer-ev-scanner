# Private repository only. The installed copy is pinned to a reviewed full SHA.
# This separate free public-results job NEVER enables the held live-odds worker.
name: Free statistics refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: read
concurrency:
  group: development-research-authority
  cancel-in-progress: false
jobs:
  statistics:
    if: >-
      github.repository == 'jpark14j/sports-ai-private-recovery' &&
      github.event.repository.private == true &&
      vars.RESEARCH_ACTIONS_FREE_TIER_REVIEWED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jpark14j/Soccer-ev-scanner
          ref: REVIEWED_FREE_STATISTICS_COMMIT
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Refresh reviewed public results and preserve held-provider state
        env:
          RESEARCH_EXPECTED_STORE_INSTANCE: 478dbf23ce374b0dafc727eca737bc5e
          RESEARCH_STATE_URL: ${{ vars.RESEARCH_STATE_URL }}
          RESEARCH_STATE_SERVICE_KEY: ${{ secrets.RESEARCH_STATE_SERVICE_KEY }}
          RESEARCH_SHARED_STATE_ENABLED: '1'
          RESEARCH_STATE_USE_REVIEWED: '1'
          RESEARCH_WORKER_ENABLED: '0'
          RESEARCH_SCHEDULE_ENABLED: '0'
          RESEARCH_MANUAL_ENABLED: '0'
          PAID_ANALYST_APPROVED: '0'
          ODDS_DAILY_CREDITS: '9'
          ODDS_API_KEY: ''
          OPENAI_API_KEY: ''
          FOOTBALL_DATA_TOKEN: ''
          FOOTBALL_DATA_ENABLED: '0'
          EPL_PUBLIC_REFRESH: '0'
          MULTI_RESULTS_REFRESH: '0'
        run: python -m intelligence.free_statistics_worker
