name: Development research audit (offline)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  audit:
    if: github.ref == 'refs/heads/development/verified-sports-intelligence'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Offline storage and lifecycle checks
        env:
          PAID_ANALYST_APPROVED: '0'
          ODDS_DAILY_CREDITS: '0'
        run: python -m intelligence.cli research-cycle --offline
      # No schedule: GitHub schedules require default-branch installation, which
      # is not authorized. No odds/AI credentials, writes, notifications or deploy.
      # Online cycles/retraining need an independently configured durable worker.
