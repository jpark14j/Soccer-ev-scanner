name: Soccer Picks Daily Telegram Digest
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 13,14 * * *'
permissions:
  contents: write
concurrency:
  group: ${{ github.ref == 'refs/heads/development/verified-sports-intelligence' && 'research-preview-single-writer' || 'soccer-picks-daily-digest' }}
  cancel-in-progress: false
jobs:
  preview-research:
    # This workflow already exists on the default branch, so an explicit API
    # dispatch can select its DEVELOPMENT definition without changing main.
    # No new cron/default-branch behavior. All flags default disabled.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/development/verified-sports-intelligence' && vars.RESEARCH_WORKER_ENABLED == '1'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Explicit fenced development research cycle
        env:
          PAID_ANALYST_APPROVED: '0'
          ODDS_DAILY_CREDITS: '9'
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_ENABLED: ${{ vars.FOOTBALL_DATA_ENABLED || '0' }}
          FOOTBALL_DATA_USE_REVIEWED: ${{ vars.FOOTBALL_DATA_USE_REVIEWED || '0' }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          RESEARCH_WORKER_ENABLED: ${{ vars.RESEARCH_WORKER_ENABLED || '0' }}
          RESEARCH_DATA_RIGHTS_VERIFIED: ${{ vars.RESEARCH_DATA_RIGHTS_VERIFIED || '0' }}
          RESEARCH_BUDGET_SCOPE_REVIEWED: ${{ vars.RESEARCH_BUDGET_SCOPE_REVIEWED || '0' }}
          RESEARCH_SHARED_STATE_ENABLED: ${{ vars.RESEARCH_SHARED_STATE_ENABLED || '0' }}
          RESEARCH_STATE_USE_REVIEWED: ${{ vars.RESEARCH_STATE_USE_REVIEWED || '0' }}
          RESEARCH_STATE_URL: ${{ vars.RESEARCH_STATE_URL }}
          RESEARCH_STATE_SERVICE_KEY: ${{ secrets.RESEARCH_STATE_SERVICE_KEY }}
        run: python -m intelligence.background --run
      # No Telegram credentials, betting actions, repository writes or deployment.
  morning-digest:
    # Never send from a development-branch manual run.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Reserve daily delivery
        id: reserve
        env:
          DIGEST_HOUR_LOCAL: ${{ vars.DIGEST_HOUR_LOCAL || '9' }}
        run: python telegram_alerts.py --reserve >> "$GITHUB_OUTPUT"
      - name: Persist reservation before sending
        if: steps.reserve.outputs.reserved == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .daily_digest_state.json
          git commit -m "Reserve daily Telegram digest [skip ci]"
          git push
      - name: Prepare daily analysis and prediction archive
        if: steps.reserve.outputs.reserved == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STREAMLIT_APP_URL: https://soccer-ev-scanner-jp.streamlit.app
          DIGEST_LEAGUES: ${{ vars.DIGEST_LEAGUES }}
          ODDS_DAILY_CREDITS: ${{ vars.ODDS_DAILY_CREDITS || '16' }}
        run: python telegram_alerts.py --prepare-reserved
      - name: Persist predictions before sending
        if: steps.reserve.outputs.reserved == 'true'
        run: |
          if [[ -n "$(git status --porcelain -- ledger/)" ]]; then
            git add ledger/
            git commit -m "Archive forward predictions before daily digest [skip ci]"
            git push
          fi
      - name: Send daily digest
        if: steps.reserve.outputs.reserved == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STREAMLIT_APP_URL: https://soccer-ev-scanner-jp.streamlit.app
        run: python telegram_alerts.py --send-reserved
      - name: Save accepted delivery state
        if: success() && steps.reserve.outputs.reserved == 'true'
        run: |
          git add .daily_digest_state.json
          git commit -m "Record daily Telegram digest [skip ci]"
          git push
      # Reservations and derived forward publications are durable GitHub records.
      # Uncertain sends remain pending for operator reconciliation; never auto-retry.
