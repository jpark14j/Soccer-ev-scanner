name: Soccer Picks Daily Telegram Digest

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 13,14 * * *'

permissions:
  contents: write

concurrency:
  group: soccer-picks-daily-digest
  cancel-in-progress: false

jobs:
  morning-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install pandas requests

      - name: Scan and send daily digest
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STREAMLIT_APP_URL: https://soccer-ev-scanner-jp.streamlit.app
        run: python telegram_alerts.py

      - name: Save last sent date
        run: |
          if [[ -n "$(git status --porcelain -- .daily_digest_state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .daily_digest_state.json
            git commit -m "Record daily Telegram digest [skip ci]"
            git push
          fi
