name: Soccer Picks Daily Telegram Digest
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 13,14 * * *'
permissions:
  contents: write
concurrency:
  group: soccer-picks-daily-digest
  cancel-in-progress: false
jobs:
  morning-digest:
    # Never send from a development-branch manual run.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Reserve daily delivery
        id: reserve
        env:
          DIGEST_HOUR_LOCAL: ${{ vars.DIGEST_HOUR_LOCAL || '9' }}
        run: python telegram_alerts.py --reserve >> "$GITHUB_OUTPUT"
      - name: Persist reservation before sending
        if: steps.reserve.outputs.reserved == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .daily_digest_state.json
          git commit -m "Reserve daily Telegram digest [skip ci]"
          git push
      - name: Prepare daily analysis and prediction archive
        if: steps.reserve.outputs.reserved == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STREAMLIT_APP_URL: https://soccer-ev-scanner-jp.streamlit.app
          DIGEST_LEAGUES: ${{ vars.DIGEST_LEAGUES }}
          ODDS_DAILY_CREDITS: ${{ vars.ODDS_DAILY_CREDITS || '16' }}
        run: python telegram_alerts.py --prepare-reserved
      - name: Persist predictions before sending
        if: steps.reserve.outputs.reserved == 'true'
        run: |
          if [[ -n "$(git status --porcelain -- ledger/)" ]]; then
            git add ledger/
            git commit -m "Archive forward predictions before daily digest [skip ci]"
            git push
          fi
      - name: Send daily digest
        if: steps.reserve.outputs.reserved == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STREAMLIT_APP_URL: https://soccer-ev-scanner-jp.streamlit.app
        run: python telegram_alerts.py --send-reserved
      - name: Save accepted delivery state
        if: success() && steps.reserve.outputs.reserved == 'true'
        run: |
          git add .daily_digest_state.json
          git commit -m "Record daily Telegram digest [skip ci]"
          git push
      # Reservations and derived forward publications are durable GitHub records.
      # Uncertain sends remain pending for operator reconciliation; never auto-retry.
